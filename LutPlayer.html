    function formatLanguage(code) {
      const map = {
        eng: 'English', chi: '简体/中文', zho: '中文', jpn: '日本語', kor: '한국어',
        spa: 'Español', fra: 'Français', fre: 'Français', deu: 'Deutsch', ger: 'Deutsch',
        ita: 'Italiano', rus: 'Русский', por: 'Português', bul: 'Български',
        cze: 'Čeština', dan: 'Dansk', fin: 'Suomi', hrv: 'Hrvatski', hun: 'Magyar',
        mac: 'Македонски', nob: 'Norsk', dut: 'Nederlands', pol: 'Polski',
        rum: 'Română', slv: 'Slovenščina', srp: 'Српски', swe: 'Svenska', und: '未知语言'
      };
      return code ? (map[code] ? `${map[code]} (${code})` : code) : '未知语言';
    }

    function isSupportedSubtitleEntry(entryType) {
      const t = String(entryType || '').toLowerCase();
      return t === 'tx3g' || t === 'wvtt';
    }

    function readU32(view, p) { return view.getUint32(p, false); }
    function readI32(view, p) { return view.getInt32(p, false); }
    function readU16(view, p) { return view.getUint16(p, false); }
    function readI16(view, p) { return view.getInt16(p, false); }
    function readI64AsNumber(view, p) {
      const hi = view.getUint32(p, false);
      const lo = view.getUint32(p + 4, false);
      return hi * 4294967296 + lo;
    }

    function fourCC(view, p) {
      return String.fromCharCode(view.getUint8(p), view.getUint8(p + 1), view.getUint8(p + 2), view.getUint8(p + 3));
    }

    function parseBoxHeader(view, offset, end) {
      if (offset + 8 > end) return null;
      let size = readU32(view, offset);
      const type = fourCC(view, offset + 4);
      let header = 8;
      if (size === 1) {
        if (offset + 16 > end) return null;
        size = readI64AsNumber(view, offset + 8);
        header = 16;
      } else if (size === 0) {
        size = end - offset;
      }
      if (!Number.isFinite(size) || size < header || offset + size > end) return null;
      return { offset, size, type, header, dataStart: offset + header, end: offset + size };
    }

    function listChildBoxes(view, start, end) {
      const boxes = [];
      let p = start;
      while (p + 8 <= end) {
        const box = parseBoxHeader(view, p, end);
        if (!box) break;
        boxes.push(box);
        p = box.end;
      }
      return boxes;
    }

    function findChild(view, parent, type) {
      return listChildBoxes(view, parent.dataStart, parent.end).find(b => b.type === type) || null;
    }

    function findChildren(view, parent, type) {
      return listChildBoxes(view, parent.dataStart, parent.end).filter(b => b.type === type);
    }

    function readFullBoxVersionFlags(view, box) {
      return {
        version: view.getUint8(box.dataStart),
        flags: (view.getUint8(box.dataStart + 1) << 16) | (view.getUint8(box.dataStart + 2) << 8) | view.getUint8(box.dataStart + 3)
      };
    }

    function decodeMdhdLanguage(view, box) {
      const { version } = readFullBoxVersionFlags(view, box);
      let p = box.dataStart + 4;
      p += version === 1 ? 16 : 8;
      p += 4;
      if (version === 1) p += 8;
      else p += 4;
      if (p + 2 > box.end) return 'und';
      const packed = readU16(view, p);
      const a = ((packed >> 10) & 0x1F) + 0x60;
      const b = ((packed >> 5) & 0x1F) + 0x60;
      const c = (packed & 0x1F) + 0x60;
      const lang = String.fromCharCode(a, b, c);
      return /^[a-z]{3}$/.test(lang) ? lang : 'und';
    }

    function readMvhdTimescale(view, box) {
      const { version } = readFullBoxVersionFlags(view, box);
      let p = box.dataStart + 4;
      p += version === 1 ? 16 : 8;
      return readU32(view, p);
    }

    function readStsdEntryType(view, stsd) {
      const p0 = stsd.dataStart + 8;
      const entryCount = readU32(view, stsd.dataStart + 4);
      const entries = [];
      let p = p0;
      for (let i = 0; i < entryCount && p + 8 <= stsd.end; i++) {
        const size = readU32(view, p);
        const type = fourCC(view, p + 4);
        if (size < 8 || p + size > stsd.end) break;
        entries.push({ type, offset: p, size });
        p += size;
      }
      return entries;
    }

    function parseStts(view, box, sampleCount) {
      const entryCount = readU32(view, box.dataStart + 4);
      let p = box.dataStart + 8;
      const dts = new Array(sampleCount);
      const durations = new Array(sampleCount);
      let sampleIndex = 0;
      let time = 0;
      for (let i = 0; i < entryCount; i++) {
        const count = readU32(view, p); const delta = readU32(view, p + 4); p += 8;
        for (let j = 0; j < count && sampleIndex < sampleCount; j++) {
          dts[sampleIndex] = time;
          durations[sampleIndex] = delta;
          time += delta;
          sampleIndex++;
        }
      }
      return { dts, durations, totalDuration: time };
    }

    function parseCtts(view, box, sampleCount) {
      const { version } = readFullBoxVersionFlags(view, box);
      const entryCount = readU32(view, box.dataStart + 4);
      let p = box.dataStart + 8;
      const offsets = new Array(sampleCount).fill(0);
      let sampleIndex = 0;
      for (let i = 0; i < entryCount; i++) {
        const count = readU32(view, p); const raw = readU32(view, p + 4); p += 8;
        const offset = version === 1 ? (raw | 0) : raw;
        for (let j = 0; j < count && sampleIndex < sampleCount; j++) offsets[sampleIndex++] = offset;
      }
      return offsets;
    }

    function parseStsz(view, box) {
      const sampleSize = readU32(view, box.dataStart + 4);
      const sampleCount = readU32(view, box.dataStart + 8);
      const sizes = new Array(sampleCount);
      if (sampleSize !== 0) {
        sizes.fill(sampleSize);
      } else {
        let p = box.dataStart + 12;
        for (let i = 0; i < sampleCount; i++, p += 4) sizes[i] = readU32(view, p);
      }
      return { sampleSize, sampleCount, sizes };
    }

    function parseChunkOffsets(view, box) {
      const count = readU32(view, box.dataStart + 4);
      let p = box.dataStart + 8;
      const offsets = new Array(count);
      for (let i = 0; i < count; i++, p += box.type === 'co64' ? 8 : 4) {
        offsets[i] = box.type === 'co64' ? readI64AsNumber(view, p) : readU32(view, p);
      }
      return offsets;
    }

    function parseStsc(view, box) {
      const count = readU32(view, box.dataStart + 4);
      let p = box.dataStart + 8;
      const entries = [];
      for (let i = 0; i < count; i++, p += 12) {
        entries.push({
          firstChunk: readU32(view, p),
          samplesPerChunk: readU32(view, p + 4),
          sampleDescriptionIndex: readU32(view, p + 8)
        });
      }
      return entries;
    }

    function buildSampleOffsets(stscEntries, chunkOffsets, sampleSizes) {
      const offsets = new Array(sampleSizes.length);
      let sampleIndex = 0;
      for (let chunkIndex = 1; chunkIndex <= chunkOffsets.length && sampleIndex < sampleSizes.length; chunkIndex++) {
        let entry = null;
        for (let i = stscEntries.length - 1; i >= 0; i--) {
          if (chunkIndex >= stscEntries[i].firstChunk) { entry = stscEntries[i]; break; }
        }
        if (!entry) break;
        let within = chunkOffsets[chunkIndex - 1];
        for (let j = 0; j < entry.samplesPerChunk && sampleIndex < sampleSizes.length; j++) {
          offsets[sampleIndex] = within;
          within += sampleSizes[sampleIndex];
          sampleIndex++;
        }
      }
      return offsets;
    }

    function parseTrackEdits(view, trak, trackTimescale, movieTimescale) {
      const edts = findChild(view, trak, 'edts');
      const elst = edts ? findChild(view, edts, 'elst') : null;
      if (!elst) return null;
      const { version } = readFullBoxVersionFlags(view, elst);
      const entryCount = readU32(view, elst.dataStart + 4);
      let p = elst.dataStart + 8;
      const edits = [];
      let movieCursor = 0;
      for (let i = 0; i < entryCount; i++) {
        let segmentDuration, mediaTime, rateInteger, rateFraction;
        if (version === 1) {
          segmentDuration = readI64AsNumber(view, p);
          mediaTime = Number(BigInt.asIntN(64, (BigInt(view.getUint32(p + 8)) << 32n) | BigInt(view.getUint32(p + 12))));
          p += 16;
        } else {
          segmentDuration = readU32(view, p); mediaTime = readI32(view, p + 4); p += 8;
        }
        rateInteger = readI16(view, p); rateFraction = readI16(view, p + 2); p += 4;
        edits.push({ segmentDuration, mediaTime, rate: rateInteger + rateFraction / 65536, movieStart: movieCursor });
        movieCursor += segmentDuration;
      }
      return { edits, movieTimescale, trackTimescale };
    }

    function mapMediaTimeToMovieSeconds(mediaTime, editInfo) {
      if (!editInfo || !editInfo.edits.length) return mediaTime / editInfo.trackTimescale;
      for (const edit of editInfo.edits) {
        const segmentMovieDuration = edit.segmentDuration;
        if (edit.mediaTime === -1) continue;
        const mediaDuration = segmentMovieDuration * edit.trackTimescale / editInfo.movieTimescale;
        if (mediaTime >= edit.mediaTime && mediaTime < edit.mediaTime + mediaDuration + 0.0001) {
          return edit.movieStart / editInfo.movieTimescale + (mediaTime - edit.mediaTime) / editInfo.trackTimescale;
        }
      }
      const firstPlayable = editInfo.edits.find(e => e.mediaTime >= 0);
      if (firstPlayable) {
        return firstPlayable.movieStart / editInfo.movieTimescale + (mediaTime - firstPlayable.mediaTime) / editInfo.trackTimescale;
      }
      return mediaTime / editInfo.trackTimescale;
    }

    function parseTrackStructure(view, trak, movieTimescale) {
      const mdia = findChild(view, trak, 'mdia');
      if (!mdia) return null;
      const hdlr = findChild(view, mdia, 'hdlr');
      const mdhd = findChild(view, mdia, 'mdhd');
      const minf = findChild(view, mdia, 'minf');
      const stbl = minf ? findChild(view, minf, 'stbl') : null;
      if (!hdlr || !mdhd || !stbl) return null;

      const handlerType = fourCC(view, hdlr.dataStart + 8);
      const trackTimescale = (() => {
        const { version } = readFullBoxVersionFlags(view, mdhd);
        let p = mdhd.dataStart + 4;
        p += version === 1 ? 16 : 8;
        return readU32(view, p);
      })();
      const language = decodeMdhdLanguage(view, mdhd);
      const stsd = findChild(view, stbl, 'stsd');
      if (!stsd) return null;
      const entries = readStsdEntryType(view, stsd);
      const supportedEntry = entries.find(e => isSupportedSubtitleEntry(e.type));
      if (!supportedEntry) return null;

      const stts = findChild(view, stbl, 'stts');
      const stsz = findChild(view, stbl, 'stsz');
      const stsc = findChild(view, stbl, 'stsc');
      const stco = findChild(view, stbl, 'stco');
      const co64 = findChild(view, stbl, 'co64');
      if (!stts || !stsz || !stsc || (!stco && !co64)) return null;

      const sizeInfo = parseStsz(view, stsz);
      const timing = parseStts(view, stts, sizeInfo.sampleCount);
      const cttsBox = findChild(view, stbl, 'ctts');
      const compositionOffsets = cttsBox
        ? parseCtts(view, cttsBox, sizeInfo.sampleCount)
        : new Array(sizeInfo.sampleCount).fill(0);
      const chunkOffsets = parseChunkOffsets(view, stco || co64);
      const stscEntries = parseStsc(view, stsc);
      const sampleOffsets = buildSampleOffsets(stscEntries, chunkOffsets, sizeInfo.sizes);
      const editInfo = parseTrackEdits(view, trak, trackTimescale, movieTimescale);

      const tkhd = findChild(view, trak, 'tkhd');
      const trackId = tkhd ? (() => {
        const { version } = readFullBoxVersionFlags(view, tkhd);
        return readU32(view, tkhd.dataStart + 4 + (version === 1 ? 16 : 8));
      })() : 0;

      let name = '';
      const udta = findChild(view, trak, 'udta');
      const nameBox = udta ? (findChild(view, udta, 'name') || findChild(view, udta, '\u00A9nam')) : null;
      if (nameBox) {
        const startOffset = nameBox.dataStart + (nameBox.type === 'name' ? 4 : 0);
        const bytes = new Uint8Array(
          view.buffer,
          view.byteOffset + startOffset,
          Math.max(0, nameBox.end - startOffset)
        );
        try {
          name = new TextDecoder('utf-8').decode(bytes).replace(/\0/g, '').trim();
        } catch (_) {}
      }

      return {
        id: trackId,
        codec: supportedEntry.type.toLowerCase(),
        language,
        name,
        handlerType,
        timescale: trackTimescale,
        sampleCount: sizeInfo.sampleCount,
        sampleSizes: sizeInfo.sizes,
        sampleOffsets,
        dts: timing.dts,
        durations: timing.durations,
        ctts: compositionOffsets,
        editInfo,
        cues: []
      };
    }

    async function readFileBoxHeader(file, offset) {
      if (!Number.isFinite(offset) || offset < 0 || offset + 8 > file.size) return null;

      const first8 = new DataView(await file.slice(offset, Math.min(file.size, offset + 8)).arrayBuffer());
      if (first8.byteLength < 8) return null;

      const size32 = first8.getUint32(0, false);
      const type = fourCC(first8, 4);

      if (size32 === 1) {
        if (offset + 16 > file.size) return null;
        const head16 = new DataView(await file.slice(offset, offset + 16).arrayBuffer());
        const size = Number(head16.getBigUint64(8, false));
        if (!Number.isSafeInteger(size) || size < 16 || offset + size > file.size) return null;
        return { offset, size, type, header: 16, dataStart: offset + 16, end: offset + size };
      }

      if (size32 === 0) {
        return { offset, size: file.size - offset, type, header: 8, dataStart: offset + 8, end: file.size };
      }

      if (size32 < 8 || offset + size32 > file.size) return null;
      return { offset, size: size32, type, header: 8, dataStart: offset + 8, end: offset + size32 };
    }

    async function locateMoovBox(file) {
      let offset = 0;
      const topLevelBoxes = [];

      while (offset + 8 <= file.size) {
        const box = await readFileBoxHeader(file, offset);
        if (!box) break;

        topLevelBoxes.push({ type: box.type, offset: box.offset, size: box.size });
        if (box.type === 'moov') return box;

        if (box.end <= offset || box.end === file.size) break;
        offset = box.end;
      }

      console.warn('MP4 顶层 box 扫描结果:', topLevelBoxes);
      return null;
    }

    async function decodeTx3gSample(data) {
      if (data.byteLength < 2) return '';
      const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
      const length = view.getUint16(0, false);
      const end = Math.min(data.byteLength, 2 + length);
      const bytes = data.subarray(2, end);
      if (!bytes.length) return '';
      if ((bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) || looksLikeUtf16Be(bytes)) {
        const start = bytes[0] === 0xFE && bytes[1] === 0xFF ? 2 : 0;
        return sanitizeSubtitleText(decodeUtf16Be(bytes.subarray(start)));
      }
      return sanitizeSubtitleText(new TextDecoder('utf-8').decode(bytes));
    }

    function looksLikeUtf16Be(bytes) {
      if (bytes.length < 4 || bytes.length % 2 !== 0) return false;
      let zeros = 0;
      for (let i = 1; i < bytes.length; i += 2) if (bytes[i] === 0) zeros++;
      return zeros > bytes.length / 6;
    }

    function decodeUtf16Be(bytes) {
      let out = '';
      for (let i = 0; i + 1 < bytes.length; i += 2) {
        out += String.fromCharCode((bytes[i] << 8) | bytes[i + 1]);
      }
      return out;
    }

    function readMp4BoxBytes(bytes, start = 0, end = bytes.byteLength) {
      const boxes = [];
      let p = start;
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      while (p + 8 <= end) {
        const size = readU32(view, p);
        const type = fourCC(view, p + 4);
        if (size < 8 || p + size > end) break;
        boxes.push({ type, data: bytes.subarray(p + 8, p + size) });
        p += size;
      }
      return boxes;
    }

    function decodeWvttSample(data) {
      const parts = [];
      for (const box of readMp4BoxBytes(data)) {
        if (box.type === 'payl') parts.push(new TextDecoder('utf-8').decode(box.data));
        else if (box.type === 'vttc') parts.push(decodeWvttSample(box.data));
      }
      return sanitizeSubtitleText(parts.length ? parts.join('\n') : new TextDecoder('utf-8').decode(data));
    }

    function sanitizeSubtitleText(text) {
      return String(text || '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/<c(?:\.[^>]*)?>/gi, '')
        .replace(/<\/c>/gi, '')
        .replace(/<v(?: [^>]*)?>/gi, '')
        .replace(/<\/v>/gi, '')
        .replace(/<b>|<\/b>|<i>|<\/i>|<u>|<\/u>/gi, '')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .trim();
    }

    async function extractTrackCues(file, track) {
      const cues = [];
      const timeScale = track.timescale || 1;
      const total = track.sampleCount;
      for (let i = 0; i < total; i++) {
        const offset = track.sampleOffsets[i];
        const size = track.sampleSizes[i];
        if (!Number.isFinite(offset) || !Number.isFinite(size) || size < 0 || offset + size > file.size) continue;
        const data = new Uint8Array(await file.slice(offset, offset + size).arrayBuffer());
        const text = track.codec === 'tx3g' ? await decodeTx3gSample(data) : decodeWvttSample(data);
        if (!text.trim()) continue;
        const mediaStart = (track.dts[i] || 0) + (track.ctts[i] || 0);
        const mediaEnd = mediaStart + (track.durations[i] || 0);
        const start = mapMediaTimeToMovieSeconds(mediaStart, track.editInfo);
        const endMapped = mapMediaTimeToMovieSeconds(mediaEnd, track.editInfo);
        const end = Math.max(endMapped, start + Math.max(0.01, (track.durations[i] || 1) / timeScale));
        cues.push({ start, end, text });
        if ((i + 1) % 25 === 0) subtitleStatus.textContent = `正在提取 ${track.codec} 字幕… ${i + 1}/${total}`;
      }
      return cues.sort((a, b) => a.start - b.start);
    }

    async function scanEmbeddedSubtitles(file) {
      const generation = ++mp4ParseGeneration;
      resetEmbeddedSubtitleSelect('正在扫描…');
      embeddedSubtitleTracks = [];
      if (!/^video\/mp4$|\.mp4$|\.m4v$/i.test(file.type || '') && !/\.(mp4|m4v)$/i.test(file.name)) {
        subtitleStatus.textContent = '当前内嵌字幕扫描器针对 MP4；请选择 MP4 文件。';
        resetEmbeddedSubtitleSelect('仅支持 MP4');
        return;
      }

      try {
        subtitleStatus.textContent = '正在读取 MP4 结构…';
        const moovLocation = await locateMoovBox(file);
        if (generation !== mp4ParseGeneration) return;
        if (!moovLocation) throw new Error('未找到 moov box');

        const moovBuffer = await file.slice(moovLocation.offset, moovLocation.offset + moovLocation.size).arrayBuffer();
        const view = new DataView(moovBuffer);
        const moov = parseBoxHeader(view, 0, view.byteLength);
        const mvhd = findChild(view, moov, 'mvhd');
        const movieTimescale = mvhd ? readMvhdTimescale(view, mvhd) : 1000;
        const traks = findChildren(view, moov, 'trak');
        const candidates = [];
        for (const trak of traks) {
          const parsed = parseTrackStructure(view, trak, movieTimescale);
          if (parsed && (parsed.handlerType === 'sbtl' || parsed.handlerType === 'text' || parsed.codec === 'tx3g' || parsed.codec === 'wvtt')) {
            candidates.push(parsed);
          }
        }

        if (!candidates.length) {
          resetEmbeddedSubtitleSelect('没有内嵌文本字幕');
          subtitleStatus.textContent = '没有检测到可解析的 MP4 内嵌文本字幕（支持 tx3g/mov_text、wvtt）。';
          return;
        }

        subtitleStatus.textContent = `发现 ${candidates.length} 条文本字幕轨，正在逐条读取 sample…`;
        const parsedTracks = [];
        for (const track of candidates) {
          if (generation !== mp4ParseGeneration) return;
          const cues = await extractTrackCues(file, track);
          parsedTracks.push({ ...track, cues });
        }

        embeddedSubtitleTracks = parsedTracks.filter(t => t.cues.length > 0);
        if (!embeddedSubtitleTracks.length) {
          resetEmbeddedSubtitleSelect('未提取到字幕内容');
          const detail = parsedTracks.map(t => `#${t.id} ${t.codec}: ${t.sampleCount} samples`).join('；');
          subtitleStatus.textContent = `检测到文本字幕轨，但未成功提取字幕 sample。${detail}`;
          return;
        }

        embeddedSubtitleSelect.innerHTML = '';
        const off = document.createElement('option');
        off.value = '';
        off.textContent = '关闭字幕';
        embeddedSubtitleSelect.appendChild(off);
        for (const track of embeddedSubtitleTracks) {
          const option = document.createElement('option');
          option.value = String(track.id);
          const name = track.name ? ` · ${track.name}` : '';
          option.textContent = `#${track.id} · ${track.codec} · ${formatLanguage(track.language)}${name} · ${track.cues.length} 条`;
          embeddedSubtitleSelect.appendChild(option);
        }
        embeddedSubtitleSelect.disabled = false;
        embeddedSubtitleSelect.value = '';
        closeEmbeddedSubtitleMenu();
        syncEmbeddedSubtitleMenu();
        activeEmbeddedTrackId = null;

        // 尝试恢复上次选中的内嵌字幕
        if (embeddedRestoreTrackId != null && activeSubtitleSource !== 'external') {
          const track = embeddedSubtitleTracks.find(t => String(t.id) === String(embeddedRestoreTrackId));
          if (track) {
            embeddedSubtitleSelect.value = String(track.id);
            embeddedSubtitleSelect.dispatchEvent(new Event('change', { bubbles: true }));
          } else {
            setSubtitleCues([], 'none', `发现 ${embeddedSubtitleTracks.length} 条内嵌文本字幕，请选择。`);
          }
          embeddedRestoreTrackId = null;
        } else if (activeSubtitleSource !== 'external') {
          setSubtitleCues([], 'none', `发现 ${embeddedSubtitleTracks.length} 条内嵌文本字幕，请选择。`);
        } else {
          subtitleStatus.textContent = `发现 ${embeddedSubtitleTracks.length} 条内嵌文本字幕（当前使用外部字幕）`;
        }
      } catch (err) {
        console.error('MP4 内嵌字幕解析失败:', err);
        if (generation !== mp4ParseGeneration) return;
        resetEmbeddedSubtitleSelect('解析失败');
        subtitleStatus.textContent = 'MP4 内嵌字幕解析失败：' + (err?.message || err);
      }
    }

    // ==========================================
    // 媒体播放与文件加载
    // ==========================================
    function setPlayIcon(isPlaying) {
      playIcon.innerHTML = isPlaying
        ? '<rect x="7" y="5" width="4" height="14" rx="1"></rect><rect x="13" y="5" width="4" height="14" rx="1"></rect>'
        : '<path d="M8 5.5v13l10-6.5-10-6.5Z"></path>';
      btnPlay.setAttribute('aria-label', isPlaying ? '暂停' : '播放');
      btnPlay.title = isPlaying ? '暂停' : '播放';
    }

    function updateNavButtons() {
      const hasCurrent = currentPlaylistIndex >= 0 && currentPlaylistIndex < playlist.length &&
        playlist[currentPlaylistIndex] && !playlist[currentPlaylistIndex].__meta;
      btnPrev.disabled = !hasCurrent || currentPlaylistIndex <= 0;
      btnNext.disabled = !hasCurrent || currentPlaylistIndex >= playlist.length - 1;
      btnPrev.style.opacity = btnPrev.disabled ? '0.35' : '1';
      btnNext.style.opacity = btnNext.disabled ? '0.35' : '1';
      btnClearPlaylist.disabled = playlist.length === 0;
      btnClearPlaylist.style.opacity = playlist.length === 0 ? '0.45' : '1';
    }

    function formatFileSize(bytes) {
      if (!Number.isFinite(bytes)) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let index = 0;
      while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index++;
      }
      return `${value.toFixed(index === 0 ? 0 : value >= 100 ? 0 : 1)} ${units[index]}`;
    }

    function renderPlaylist() {
      playlistList.innerHTML = '';
      playlistCount.textContent = `${playlist.length} 个视频`;

      if (!playlist.length) {
        const empty = document.createElement('div');
        empty.className = 'playlist-empty';
        empty.innerHTML = '还没有视频。<br>点击“添加视频”可以一次选择多个文件，<br>也可以把文件直接拖进播放器。';
        playlistList.appendChild(empty);
        updateNavButtons();
        return;
      }

      playlist.forEach((file, index) => {
        const isMeta = !!file.__meta;
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'playlist-item'
          + (index === currentPlaylistIndex ? ' active' : '')
          + (isMeta ? ' pending' : '');
        item.title = isMeta ? `${file.name}（待重新选择）` : file.name;

        item.innerHTML = `
          <span class="playlist-index">${String(index + 1).padStart(2, '0')}</span>
          <span class="playlist-name"></span>
          <span class="playlist-size">${formatFileSize(file.size)}</span>
        `;
        item.querySelector('.playlist-name').textContent = isMeta
          ? `${file.name}（待重新选择）`
          : file.name;

        item.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (isMeta) {
            showToast('请重新选择该视频文件以恢复播放');
            inputVideo.click();
            return;
          }
          await loadPlaylistItem(index, true);
        });
        playlistList.appendChild(item);
      });
      updateNavButtons();
    }

    function addFilesToPlaylist(files, options = {}) {
      const { playSingle = false, autoLoadFirstIfIdle = false } = options;

      const incoming = Array.from(files || []).filter(isVideoFile);
      if (!incoming.length) {
        showToast('没有可播放的视频文件');
        return;
      }

      let lastAddedIndex = -1;
      let addedCount = 0;

      for (const file of incoming) {
        const key = fileKey(file);

        // 优先匹配"待重新选择"的元数据槽位
        const metaIdx = playlist.findIndex(item => item.__meta && fileKey(item) === key);
        if (metaIdx !== -1) {
          playlist[metaIdx] = file;
          lastAddedIndex = metaIdx;
          continue;
        }

        // 已存在真实文件则跳过
        if (playlist.some(item => !item.__meta && fileKey(item) === key)) continue;

        playlist.push(file);
        lastAddedIndex = playlist.length - 1;
        addedCount++;
      }

      renderPlaylist();
      saveStateNow();

      // 拖入/选择单个视频 → 直接播放
      if (playSingle && incoming.length === 1 && lastAddedIndex !== -1) {
        loadPlaylistItem(lastAddedIndex, true);
        return;
      }

      // 当前无视频时，自动加载第一个真实文件
      const hasCurrent = currentPlaylistIndex >= 0 && playlist[currentPlaylistIndex] && !playlist[currentPlaylistIndex].__meta;
      if (autoLoadFirstIfIdle && !hasCurrent && !video.src) {
        const firstReal = playlist.findIndex(f => !f.__meta);
        if (firstReal !== -1) {
          loadPlaylistItem(firstReal, true);
          return;
        }
      }

      showToast(addedCount > 0 ? `已加入 ${addedCount} 个视频` : '没有新增视频');
    }

    function resetMediaUiForNewItem() {
      txtCurrentTime.textContent = '00:00';
      txtDuration.textContent = '00:00';
      seekBar.value = '0';
      setPlayIcon(false);
      setPlayerStatus('加载中');

      activeEmbeddedTrackId = null;
      embeddedSubtitleTracks = [];
      embeddedSubtitleSelect.innerHTML = '<option value="">正在扫描…</option>';
      embeddedSubtitleSelect.disabled = true;
      closeEmbeddedSubtitleMenu();
      syncEmbeddedSubtitleMenu();

      // 外部字幕是全局保持的：如果之前启用了外部字幕，切换视频后继续沿用
      if (activeSubtitleSource === 'external' && externalSubtitleData) {
        subFileName.textContent = externalSubtitleData.name || '外部字幕';
        subtitleStatus.textContent = `外部字幕：${externalSubtitleData.name || ''}`;
      } else {
        subtitles = [];
        activeSubtitleSource = 'none';
        subtitleLayer.textContent = '';
        subFileName.textContent = '选择 .srt / .vtt';
        subtitleStatus.textContent = '正在扫描 MP4 内嵌文本字幕…';
        inputSub.value = '';
      }

      currentTitle.textContent = '加载中…';
    }

    async function loadPlaylistItem(index, autoplay = true) {
      if (index < 0 || index >= playlist.length) return;

      const file = playlist[index];
      if (!file || file.__meta) {
        showToast('请重新选择该视频文件以恢复播放');
        inputVideo.click();
        return;
      }

      // 切换前先保存当前进度
      saveStateNow();

      currentPlaylistIndex = index;
      renderPlaylist();
      togglePlaylist(false);
      resetMediaUiForNewItem();
      currentTitle.textContent = file.name;

      // 判断是否需要恢复进度
      let seekTarget = 0;
      if (restoreKey && fileKey(file) === restoreKey && restoreTime > 0) {
        seekTarget = restoreTime;
        restoreKey = null;
        restoreTime = 0;
      }
      pendingSeekTime = seekTarget;

      if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
      videoObjectUrl = URL.createObjectURL(file);
      video.src = videoObjectUrl;
      video.load();

      try {
        if (autoplay) {
          await video.play();
          setPlayIcon(true);
          setPlayerStatus('播放中');
        } else {
          video.pause();
          setPlayIcon(false);
          setPlayerStatus('待播放');
        }
      } catch (err) {
        console.warn('自动播放被浏览器阻止，请手动点击播放。', err);
        setPlayIcon(false);
        setPlayerStatus('待播放');
      }

      if (/\.(mp4|m4v)$/i.test(file.name)) {
        scanEmbeddedSubtitles(file);
      } else {
        embeddedSubtitleSelect.innerHTML = '<option value="">仅扫描 MP4</option>';
        embeddedSubtitleSelect.disabled = true;
        closeEmbeddedSubtitleMenu();
        syncEmbeddedSubtitleMenu();
        subtitleStatus.textContent = '内嵌字幕扫描器目前只针对 MP4。';
      }

      saveStateNow();
    }

    // ==========================================
    // 外部字幕 / LUT 加载
    // ==========================================
    async function loadExternalSubtitleFile(file) {
      const text = await file.text();
      parseSRTorVTT(text);

      activeSubtitleSource = 'external';
      activeSubtitleFileName = file.name;
      externalSubtitleData = { name: file.name, text };

      // 关闭内嵌字幕
      activeEmbeddedTrackId = null;
      embeddedSubtitleSelect.value = '';
      closeEmbeddedSubtitleMenu();
      syncEmbeddedSubtitleMenu();

      subFileName.textContent = file.name;
      subtitleStatus.textContent = `外部字幕：${file.name}`;
      updateSubtitles();

      await saveAssets();
      saveStateNow();
    }

    async function loadLutFile(file) {
      const text = await file.text();
      currentLutText = text;
      currentLutFileName = file.name;
      lutFileName.textContent = file.name;

      parseAndApplyCubeLUT(text);
      chkLut.checked = true;

      await saveAssets();
      saveStateNow();
    }

    // ==========================================
    // 事件绑定
    // ==========================================
    btnPlay.addEventListener('click', async () => {
      if (!video.src) {
        const firstReal = playlist.findIndex(f => !f.__meta);
        if (firstReal !== -1) {
          await loadPlaylistItem(firstReal, true);
          return;
        }
        if (playlist.length > 0) {
          showToast('请重新选择视频文件');
          inputVideo.click();
          return;
        }
        inputVideo.click();
        showToast('请选择一个视频');
        return;
      }
      if (video.paused) {
        try {
          await video.play();
        } catch (err) {
          console.warn(err);
          showToast('播放失败，请检查视频格式');
        }
      } else {
        video.pause();
      }
    });

    video.addEventListener('play', () => {
      setPlayIcon(true);
      setPlayerStatus('播放中');
      showUI();
    });

    video.addEventListener('pause', () => {
      setPlayIcon(false);
      setPlayerStatus(video.ended ? '已结束' : '已暂停');
      showUI();
      saveStateNow();
    });

    video.addEventListener('loadedmetadata', () => {
      txtDuration.textContent = formatTime(video.duration);
      setPlayerStatus(video.paused ? '待播放' : '播放中');

      if (pendingSeekTime > 0 && Number.isFinite(video.duration)) {
        try {
          video.currentTime = Math.min(pendingSeekTime, Math.max(0, video.duration - 0.05));
        } catch (err) {
          console.warn('恢复时间戳失败', err);
        }
        pendingSeekTime = 0;
        updateSubtitles();
        showToast(`已恢复到 ${formatTime(video.currentTime)}`);
      }
    });

    video.addEventListener('timeupdate', () => {
      if (!isNaN(video.duration) && video.duration > 0) {
        seekBar.value = String((video.currentTime / video.duration) * 100);
        txtCurrentTime.textContent = formatTime(video.currentTime);
        txtDuration.textContent = formatTime(video.duration);
      }
      updateSubtitles();
      saveStateThrottled();
    });

    video.addEventListener('seeked', () => {
      updateSubtitles();
      saveStateNow();
    });

    video.addEventListener('ended', async () => {
      if (currentPlaylistIndex >= 0 && currentPlaylistIndex < playlist.length - 1) {
        // 跳过元数据槽位
        let nextIndex = currentPlaylistIndex + 1;
        while (nextIndex < playlist.length && playlist[nextIndex].__meta) nextIndex++;
        if (nextIndex < playlist.length) {
          await loadPlaylistItem(nextIndex, true);
          showToast('自动播放下一部');
          return;
        }
      }
      setPlayerStatus('播放完成');
      setPlayIcon(false);
    });

    seekBar.addEventListener('input', () => {
      if (!isNaN(video.duration) && video.duration > 0) {
        video.currentTime = (Number(seekBar.value) / 100) * video.duration;
        updateSubtitles();
      }
    });

    volumeBar.addEventListener('input', () => {
      video.volume = Number(volumeBar.value);
      if (video.volume > 0) video.muted = false;
      saveStateNow();
    });

    function changeVolume(delta) {
      let next = video.volume + delta;
      next = Math.min(1, Math.max(0, Number(next.toFixed(4))));
      video.volume = next;
      if (next > 0) video.muted = false;
      volumeBar.value = String(next);
      showToast(`音量 ${Math.round(next * 100)}%`);
      saveStateNow();
    }

    btnPrev.addEventListener('click', async (e) => {
      e.stopPropagation();
      let prevIndex = currentPlaylistIndex - 1;
      while (prevIndex >= 0 && playlist[prevIndex].__meta) prevIndex--;
      if (prevIndex >= 0) await loadPlaylistItem(prevIndex, true);
    });

    btnNext.addEventListener('click', async (e) => {
      e.stopPropagation();
      let nextIndex = currentPlaylistIndex + 1;
      while (nextIndex < playlist.length && playlist[nextIndex].__meta) nextIndex++;
      if (nextIndex < playlist.length) await loadPlaylistItem(nextIndex, true);
    });

    btnClearPlaylist.addEventListener('click', async (e) => {
      e.stopPropagation();
      playlist = [];
      currentPlaylistIndex = -1;
      restoreKey = null;
      restoreTime = 0;
      pendingSeekTime = 0;

      if (videoObjectUrl) {
        URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = null;
      }
      video.removeAttribute('src');
      video.load();

      currentTitle.textContent = '选择一个视频开始播放';
      setPlayerStatus('就绪');
      txtCurrentTime.textContent = '00:00';
      txtDuration.textContent = '00:00';
      seekBar.value = '0';
      setPlayIcon(false);

      setSubtitleCues([], 'none', '等待视频');
      resetEmbeddedSubtitleSelect('请先选择 MP4');

      renderPlaylist();
      saveStateNow();
      showToast('播放列表已清空');
    });

    inputVideo.addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files?.length) return;
      addFilesToPlaylist(files, {
        playSingle: files.length === 1,
        autoLoadFirstIfIdle: true
      });
      inputVideo.value = '';
    });

    embeddedSubtitleTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleEmbeddedSubtitleMenu();
    });

    embeddedSubtitleMenu.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    document.addEventListener('click', (e) => {
      if (!embeddedSubtitlePicker.contains(e.target)) closeEmbeddedSubtitleMenu();
    });

    embeddedSubtitleSelect.addEventListener('change', () => {
      syncEmbeddedSubtitleMenu();
      const value = embeddedSubtitleSelect.value;

      if (value === '') {
        activeEmbeddedTrackId = null;
        if (activeSubtitleSource === 'embedded') {
          setSubtitleCues([], 'none', '已关闭字幕');
        }
        saveStateNow();
        return;
      }

      const track = embeddedSubtitleTracks.find(t => String(t.id) === value);
      if (!track) {
        setSubtitleCues([], 'none', '未找到所选字幕轨');
        return;
      }

      activeEmbeddedTrackId = track.id;
      activeSubtitleSource = 'embedded';
      setSubtitleCues(
        track.cues,
        'embedded',
        `内嵌字幕：${track.codec} · ${formatLanguage(track.language)}（${track.cues.length} 条）`
      );
      saveStateNow();
    });

    subtitleSizeInput.addEventListener('input', () => {
      setSubtitleFontSize(subtitleSizeInput.value);
      saveStateNow();
    });

    inputLut.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await loadLutFile(file);
      showToast(`LUT 已载入并开启：${file.name}`);
      inputLut.value = '';
    });

    inputSub.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await loadExternalSubtitleFile(file);
      showToast(`外部字幕已载入：${file.name}`);
      inputSub.value = '';
    });

    chkLut.addEventListener('change', () => {
      showToast(chkLut.checked ? 'LUT 已开启' : 'LUT 已关闭');
      saveStateNow();
    });

    // ==========================================
    // 键盘快捷键
    // ==========================================
    document.addEventListener('keydown', async (e) => {
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      switch (e.code) {
        case 'Space':
          e.preventDefault();
          btnPlay.click();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          video.currentTime = Math.max(0, video.currentTime - 5);
          updateSubtitles();
          showToast('快退 5 秒');
          saveStateNow();
          break;
        case 'ArrowRight':
          e.preventDefault();
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
          updateSubtitles();
          showToast('快进 5 秒');
          saveStateNow();
          break;
        case 'ArrowUp':
          e.preventDefault();
          changeVolume(0.05);
          break;
        case 'ArrowDown':
          e.preventDefault();
          changeVolume(-0.05);
          break;
        case 'KeyF':
          e.preventDefault();
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            btnExitFullscreen.click();
          } else {
            btnEnterFullscreen.click();
          }
          break;
        case 'KeyM':
          e.preventDefault();
          video.muted = !video.muted;
          volumeBar.value = video.muted ? '0' : String(video.volume || 1);
          showToast(video.muted ? '已静音' : '已取消静音');
          saveStateNow();
          break;
        case 'Escape':
          closeEmbeddedSubtitleMenu();
          break;
      }
    });

    // ==========================================
    // 拖放导入
    // ==========================================
    let dragCounter = 0;

    container.addEventListener('dragenter', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter++;
      container.classList.add('drag-over');
    });

    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });

    container.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        container.classList.remove('drag-over');
      }
    });

    container.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragCounter = 0;
      container.classList.remove('drag-over');
      showUI();

      const files = Array.from(e.dataTransfer?.files || []);
      if (!files.length) return;

      const videos = files.filter(isVideoFile);
      const subtitleFiles = files.filter(isSubtitleFile);
      const lutFiles = files.filter(isLutFile);

      const ignored = files.length - videos.length - subtitleFiles.length - lutFiles.length;

      // 视频处理
      if (videos.length === 1) {
        addFilesToPlaylist(videos, { playSingle: true, autoLoadFirstIfIdle: true });
      } else if (videos.length > 1) {
        addFilesToPlaylist(videos, { playSingle: false, autoLoadFirstIfIdle: true });
      }

      // 字幕处理：只能一个
      if (subtitleFiles.length === 1) {
        await loadExternalSubtitleFile(subtitleFiles[0]);
        showToast(`外部字幕已载入：${subtitleFiles[0].name}`);
      } else if (subtitleFiles.length > 1) {
        showToast('一次只能拖入一个字幕文件，操作已忽略');
      }

      // LUT 处理：只能一个
      if (lutFiles.length === 1) {
        await loadLutFile(lutFiles[0]);
        showToast(`LUT 已载入并开启：${lutFiles[0].name}`);
      } else if (lutFiles.length > 1) {
        showToast('一次只能拖入一个 LUT 文件，操作已忽略');
      }

      if (!videos.length && !subtitleFiles.length && !lutFiles.length) {
        showToast('未识别到可导入的文件');
      }
    });

    // 阻止浏览器直接打开拖入文件
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('drop', (e) => { e.preventDefault(); });

    // ==========================================
    // 退出前保存
    // ==========================================
    window.addEventListener('beforeunload', () => {
      try { saveQuickState(); } catch (_) {}
    });
    window.addEventListener('pagehide', () => {
      try { saveQuickState(); } catch (_) {}
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        try { saveQuickState(); } catch (_) {}
      }
    });

    // ==========================================
    // 时间格式化
    // ==========================================
    function formatTime(sec) {
      if (!Number.isFinite(sec) || sec < 0) sec = 0;
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h > 0) {
        return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // ==========================================
    // 初始化
    // ==========================================
    initWebGL();
    requestAnimationFrame(render);

    setSubtitleFontSize(DEFAULT_SUBTITLE_SIZE);
    setPlayIcon(false);

    restoreState().then(() => {
      renderPlaylist();
      updateNavButtons();
      console.log('状态恢复完成');
    }).catch((err) => {
      console.warn('状态恢复失败', err);
      renderPlaylist();
    });

  </script>
</body>
</html>
